x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build: .
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Overrides the host absolute path in .env with the in-container mount below.
      GITHUB_PRIVATE_KEY_PATH: /app/secrets/github-private-key.pem
    volumes:
      # Update this filename if the GitHub App private key is ever rotated.
      - ./codelens-spraha.2026-08-18.private-key.pem:/app/secrets/github-private-key.pem:ro

  worker:
    build: .
    command: ["python", "-m", "app.core.worker_supervisor"]
    restart: unless-stopped
    stop_grace_period: 16m30s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.worker_supervisor", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    env_file:
      - .env
    environment:
      GITHUB_PRIVATE_KEY_PATH: /app/secrets/github-private-key.pem
    volumes:
      - ./codelens-spraha.2026-08-18.private-key.pem:/app/secrets/github-private-key.pem:ro

  flower:
    build: .
    command: celery -A app.core.celery_app flower --port=5555
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5555:5555"
    env_file:
      - .env
    environment:
      GITHUB_PRIVATE_KEY_PATH: /app/secrets/github-private-key.pem
    volumes:
      - ./codelens-spraha.2026-08-18.private-key.pem:/app/secrets/github-private-key.pem:ro
